<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Castor</title>
  <style>
    /* 色は変数にまとめ、OS のテーマ（prefers-color-scheme）で切り替える。既定はダーク（v1.1.0 までと同じ配色） */
    :root {
      color-scheme: dark;
      --bg: rgb(19, 19, 20);
      --fg: rgb(227, 227, 227);
      --field-bg: rgb(40, 40, 42);
      --field-border: rgb(60, 60, 62);
      --hover-bg: rgb(55, 55, 58);
      --accent: #8ab4f8;
      --on-accent: rgb(19, 19, 20);
    }
    /* ライトの配色は Gemini のライトテーマの色（--gem-sys-color--*、2026-10-06 に確認）に合わせる */
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #fff;
        --fg: #1f1f1f;
        --field-bg: #f0f4f9;
        --field-border: #c4c7c5;
        --hover-bg: #dde3ea;
        --accent: #0b57d0;
        --on-accent: #fff;
      }
    }
    body { width: 260px; padding: 16px; font-family: "Google Sans", sans-serif; font-size: 14px; background: var(--bg); color: var(--fg); }
    label, .heading { display: block; margin-bottom: 8px; font-size: 13px; opacity: 0.7; }
    input[type="number"] { width: 80px; padding: 8px 10px; background: var(--field-bg); color: var(--fg); border: 1px solid var(--field-border); border-radius: 12px; font-size: 14px; outline: none; }
    input[type="number"]:focus { border-color: var(--accent); }
    .row { display: flex; align-items: center; gap: 8px; }
    #unitLabel { opacity: 0.7; }
    #status { color: var(--accent); font-size: 12px; margin-top: 10px; }
    .toggle { display: flex; background: var(--field-bg); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .toggle button { flex: 1; border: none; padding: 8px 12px; cursor: pointer; background: transparent; font-size: 13px; color: var(--fg); transition: background 0.15s; }
    .toggle button:hover { background: var(--hover-bg); }
    .toggle button.active { background: var(--accent); color: var(--on-accent); font-weight: 500; }
    .section { margin-top: 18px; }
    label.feature { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; opacity: 1; cursor: pointer; }
    .feature input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>
  <label for="maxWidth" data-i18n="widthLabel">Max chat width</label>
  <div class="toggle">
    <button id="btnPercent" data-unit="percent">%</button>
    <button id="btnPx" data-unit="px">px</button>
  </div>
  <div class="row">
    <input type="number" id="maxWidth">
    <span id="unitLabel">%</span>
  </div>
  <div class="section">
    <div class="heading" data-i18n="featuresLabel">Features</div>
    <!-- 文言は span に入れる（label に data-i18n を付けると textContent の置き換えで checkbox が消える） -->
    <label class="feature"><input type="checkbox" data-feature="enterNewline"><span data-i18n="featureEnterNewline">Enter inserts a newline</span></label>
    <label class="feature"><input type="checkbox" data-feature="ctrlEnterSend"><span data-i18n="featureCtrlEnterSend">Ctrl+Enter sends</span></label>
    <label class="feature"><input type="checkbox" data-feature="cmdEnterSend"><span data-i18n="featureCmdEnterSend">Cmd+Enter sends (macOS)</span></label>
    <label class="feature"><input type="checkbox" data-feature="ctrlCStop"><span data-i18n="featureCtrlCStop">Ctrl+C stops generating</span></label>
    <label class="feature"><input type="checkbox" data-feature="scrollButton"><span data-i18n="featureScrollButton">Scroll-to-bottom button</span></label>
  </div>
  <div id="status"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
