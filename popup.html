<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 16px; font-family: "Google Sans", sans-serif; font-size: 14px; background: rgb(19, 19, 20); color: rgb(227, 227, 227); }
    label { display: block; margin-bottom: 8px; font-size: 13px; opacity: 0.7; }
    input[type="number"] { width: 80px; padding: 8px 10px; background: rgb(40, 40, 42); color: rgb(227, 227, 227); border: 1px solid rgb(60, 60, 62); border-radius: 12px; font-size: 14px; outline: none; }
    input[type="number"]:focus { border-color: #8ab4f8; }
    .row { display: flex; align-items: center; gap: 8px; }
    #unitLabel { opacity: 0.5; }
    #status { color: #8ab4f8; font-size: 12px; margin-top: 10px; }
    .toggle { display: flex; background: rgb(40, 40, 42); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .toggle button { flex: 1; border: none; padding: 8px 12px; cursor: pointer; background: transparent; font-size: 13px; color: rgb(227, 227, 227); transition: background 0.15s; }
    .toggle button:hover { background: rgb(55, 55, 58); }
    .toggle button.active { background: #8ab4f8; color: rgb(19, 19, 20); font-weight: 500; }
  </style>
</head>
<body>
  <label>チャット横幅の上限</label>
  <div class="toggle">
    <button id="btnPercent" data-unit="percent">％</button>
    <button id="btnPx" data-unit="px">px</button>
  </div>
  <div class="row">
    <input type="number" id="maxWidth">
    <span id="unitLabel">%</span>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
